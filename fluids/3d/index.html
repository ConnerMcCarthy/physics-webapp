<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Wing Visualization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030711;
  --surface: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.07);
  --purple: rgba(178,139,255,1);
  --purple-dim: rgba(178,139,255,0.35);
  --blue: rgba(93,170,255,1);
  --blue-dim: rgba(93,170,255,0.28);
  --text: rgba(255,255,255,0.88);
  --text-muted: rgba(255,255,255,0.48);
  --text-faint: rgba(255,255,255,0.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(93,170,255,0.055) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(178,139,255,0.06) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 40px 32px;
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--blue);
  opacity: 0.75;
  margin-bottom: 12px;
}

.header-title {
  font-family: 'Exo 2', sans-serif;
  font-weight: 700;
  font-size: clamp(28px, 5vw, 48px);
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #fff 30%, rgba(178,139,255,0.9) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.header-sub {
  font-size: 14px;
  color: var(--text-muted);
}

.container {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 28px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  flex: 1;
}

.canvas-wrapper {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  overflow: hidden;
  min-height: 600px;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

canvas:active {
  cursor: grabbing;
}

.canvas-label {
  position: absolute;
  top: 16px;
  left: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--purple);
  opacity: 0.6;
  pointer-events: none;
}

.canvas-hint {
  position: absolute;
  bottom: 16px;
  left: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-faint);
  pointer-events: none;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.control-group {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  padding: 16px;
}

.control-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--purple);
  opacity: 0.7;
  margin-bottom: 8px;
  display: block;
}

.slider-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.slider-name {
  font-size: 12px;
  color: var(--text);
}

.slider-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--blue);
  font-weight: 500;
}

input[type="range"] {
  width: 100%;
  height: 5px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--purple-dim), var(--blue-dim));
  outline: none;
  -webkit-appearance: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--purple);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(178,139,255,0.5);
}

input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--purple);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 8px rgba(178,139,255,0.5);
}

select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
}

select option {
  background: var(--bg);
  color: var(--text);
}

button {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

button:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--purple-dim);
  color: var(--purple);
}

button.active {
  background: var(--purple);
  color: var(--bg);
  border-color: var(--purple);
}

.info-box {
  border: 1px solid var(--blue-dim);
  border-left: 3px solid var(--blue);
  border-radius: 8px;
  background: rgba(93,170,255,0.05);
  padding: 12px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-muted);
}

.nav-link {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--purple);
  text-decoration: none;
  transition: color 0.2s;
  margin-top: 20px;
}

.nav-link:hover { color: var(--blue); }

@media (max-width: 1024px) {
  .container {
    grid-template-columns: 1fr;
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .control-group {
    padding: 12px;
  }
}

@media (max-width: 640px) {
  .page { padding: 24px 16px; }

  .header { margin-bottom: 24px; }

  .container {
    gap: 16px;
  }

  .canvas-wrapper { min-height: 400px; }

  .controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="header-label">Fluid Mechanics</div>
    <h1 class="header-title">3D Wing Model</h1>
    <p class="header-sub">Rotating visualization with flow effects</p>
  </div>

  <div class="container">
    <div class="canvas-wrapper">
      <canvas id="wingCanvas"></canvas>
      <div class="canvas-label">3D Wing Visualization</div>
      <div class="canvas-hint">Drag to rotate • Scroll to zoom</div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label">Angle of Attack</label>
        <div class="slider-container">
          <div class="slider-header">
            <span class="slider-name">AOA</span>
            <span class="slider-value" id="aoaValue">0°</span>
          </div>
          <input type="range" id="aoaSlider" min="-15" max="25" value="0" step="1">
        </div>
      </div>

      <div class="control-group">
        <label class="control-label">Wing Span</label>
        <div class="slider-container">
          <div class="slider-header">
            <span class="slider-name">Length</span>
            <span class="slider-value" id="spanValue">1.0x</span>
          </div>
          <input type="range" id="spanSlider" min="0.5" max="2" value="1" step="0.1">
        </div>
      </div>

      <div class="control-group">
        <label class="control-label">Wing Shape</label>
        <select id="wingShape">
          <option value="naca2412">NACA 2412</option>
          <option value="naca0012">NACA 0012 (Symmetric)</option>
          <option value="naca4412">NACA 4412</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Visualization</label>
        <select id="vizMode">
          <option value="solid">Solid Wing</option>
          <option value="pressure">Pressure Field</option>
          <option value="flow" selected>Animated Airflow</option>
        </select>
      </div>

      <div class="info-box">
        <strong>3D View:</strong> Rotate the wing by dragging. This perspective shows how flow patterns change around the full wing geometry.
      </div>

      <a href="/fluids" class="nav-link">← 2D Visualization</a>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════════
// 3D WING VISUALIZATION
// ════════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('wingCanvas');
const ctx = canvas.getContext('2d');

let state = {
  aoa: 0,
  span: 1,
  wingShape: 'naca2412',
  vizMode: 'flow',
  rotation: { x: 0.3, y: 0.5 },
  zoom: 1,
  flowTime: 0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// Canvas setup
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ════════════════════════════════════════════════════════════════════════════════
// 3D MATH
// ════════════════════════════════════════════════════════════════════════════════

function rotateX(p, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return {
    x: p.x,
    y: p.y * cos - p.z * sin,
    z: p.y * sin + p.z * cos
  };
}

function rotateY(p, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return {
    x: p.x * cos + p.z * sin,
    y: p.y,
    z: -p.x * sin + p.z * cos
  };
}

function rotateZ(p, angle) {
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  return {
    x: p.x * cos - p.y * sin,
    y: p.x * sin + p.y * cos,
    z: p.z
  };
}

function project(p, scale = 500) {
  const W = canvas.width / window.devicePixelRatio;
  const H = canvas.height / window.devicePixelRatio;
  const depth = 1 / (2 + p.z * 0.5);
  return {
    x: W * 0.5 + p.x * scale * depth,
    y: H * 0.5 - p.y * scale * depth,
    z: p.z,
    depth: depth
  };
}

// ════════════════════════════════════════════════════════════════════════════════
// WING GENERATION
// ════════════════════════════════════════════════════════════════════════════════

function generateWing(code, span, numChord = 60, numSpan = 20) {
  const digits = String(code).replace(/^naca/i, '');
  const m = parseInt(digits[0], 10) / 100;
  const p = parseInt(digits[1], 10) / 10;
  const t = parseInt(digits.slice(2), 10) / 100;

  const vertices = [];

  // Generate profile at different span positions
  for (let s = 0; s < numSpan; s++) {
    const spanPos = (s / (numSpan - 1)) - 0.5;
    const z = spanPos * span * 0.8;

    for (let c = 0; c < numChord; c++) {
      const x = c / (numChord - 1);

      // Thickness
      const yt = 5 * t * (
        0.2969 * Math.sqrt(x) -
        0.1260 * x -
        0.3516 * x * x +
        0.2843 * x * x * x -
        0.1015 * x * x * x * x
      );

      // Camber
      let yc = 0;
      if (x <= p && p > 0) {
        yc = m / (p * p) * (2 * p * x - x * x);
      } else if (x > p && p > 0) {
        yc = m / ((1 - p) * (1 - p)) * ((1 - 2 * p) + 2 * p * x - x * x);
      }

      // Upper and lower
      vertices.push({
        x: (x - 0.5) * 1.2,
        y: yc + yt,
        z: z
      });
    }

    for (let c = numChord - 1; c >= 0; c--) {
      const x = c / (numChord - 1);

      const yt = 5 * t * (
        0.2969 * Math.sqrt(x) -
        0.1260 * x -
        0.3516 * x * x +
        0.2843 * x * x * x -
        0.1015 * x * x * x * x
      );

      let yc = 0;
      if (x <= p && p > 0) {
        yc = m / (p * p) * (2 * p * x - x * x);
      } else if (x > p && p > 0) {
        yc = m / ((1 - p) * (1 - p)) * ((1 - 2 * p) + 2 * p * x - x * x);
      }

      vertices.push({
        x: (x - 0.5) * 1.2,
        y: yc - yt,
        z: z
      });
    }
  }

  return vertices;
}

// ════════════════════════════════════════════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════════════════════════════════════════════

function animate() {
  const W = canvas.width / window.devicePixelRatio;
  const H = canvas.height / window.devicePixelRatio;

  // Clear
  ctx.fillStyle = 'rgba(3,7,17,0.9)';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 80) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 80) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Generate wing
  const vertices = generateWing(state.wingShape, state.span);

  // Transform
  const aoaRad = state.aoa * Math.PI / 180;
  const transformed = vertices.map(v => {
    let p = rotateZ(v, aoaRad);
    p = rotateX(p, state.rotation.x);
    p = rotateY(p, state.rotation.y);
    return project(p, 400 * state.zoom);
  });

  state.flowTime += 0.016;

  // Keep the wing visible beneath every visualization mode.
  {
    ctx.strokeStyle = state.vizMode === 'solid'
      ? 'rgba(178,139,255,0.55)'
      : 'rgba(178,139,255,0.25)';
    ctx.lineWidth = 1;

    const numChord = 120;
    for (let i = 0; i < transformed.length - numChord; i += numChord) {
      ctx.beginPath();
      for (let j = 0; j < numChord; j++) {
        const pt = transformed[i + j];
        if (j === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
    }

    // Spanwise lines
    const numSpan = 20;
    const ptPerSpan = transformed.length / numSpan;
    for (let s = 0; s < numSpan; s++) {
      ctx.beginPath();
      for (let c = 0; c < 120; c++) {
        const idx = Math.floor(s * ptPerSpan + c);
        if (idx < transformed.length) {
          const pt = transformed[idx];
          if (c === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
      }
      ctx.stroke();
    }

    // Surface fill
    ctx.fillStyle = state.vizMode === 'solid'
      ? 'rgba(93,170,255,0.12)'
      : 'rgba(93,170,255,0.06)';
    ctx.beginPath();
    transformed.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    });
    ctx.closePath();
    ctx.fill();
  }

  // Flow vectors
  if (state.vizMode === 'flow') {
    const liftStrength = Math.sin((state.aoa + 2) * Math.PI / 180);
    const spanExtent = state.span * 0.55;
    const streamlines = [];

    for (let spanLane = 0; spanLane < 9; spanLane++) {
      const z = -spanExtent + (spanLane / 8) * spanExtent * 2;
      for (let heightLane = 0; heightLane < 3; heightLane++) {
        const baseY = (heightLane - 1) * 0.23;
        const points = [];

        for (let step = 0; step <= 48; step++) {
          const x = -1.8 + (step / 48) * 3.6;
          const nearWing = Math.exp(-Math.pow(x / 0.58, 2));
          const side = baseY === 0 ? (spanLane % 2 === 0 ? 1 : -1) : Math.sign(baseY);
          const clearance = side * 0.10 * nearWing;
          const wake = 1 / (1 + Math.exp(-5 * (x - 0.25)));
          const finiteWing = Math.max(0.25, 1 - Math.pow(z / (spanExtent * 1.15), 2));
          const downwash = -liftStrength * 0.42 * wake * finiteWing;

          let point = { x, y: baseY + clearance + downwash, z };
          point = rotateX(point, state.rotation.x);
          point = rotateY(point, state.rotation.y);
          points.push(project(point, 400 * state.zoom));
        }
        streamlines.push(points);

        ctx.strokeStyle = 'rgba(93,190,255,0.68)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        points.forEach((point, i) => {
          if (i === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        ctx.stroke();
      }
    }

    streamlines.forEach((points, lane) => {
      const progress = (state.flowTime * 0.32 + lane * 0.073) % 1;
      const index = Math.min(points.length - 2, Math.floor(progress * (points.length - 1)));
      const fraction = progress * (points.length - 1) - index;
      const a = points[index];
      const b = points[index + 1];
      const x = a.x + (b.x - a.x) * fraction;
      const y = a.y + (b.y - a.y) * fraction;
      ctx.fillStyle = 'rgba(220,242,255,1)';
      ctx.shadowColor = 'rgba(93,190,255,0.9)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    if (Math.abs(liftStrength) > 0.02) {
      ctx.fillStyle = 'rgba(93,170,255,0.72)';
      ctx.font = '12px JetBrains Mono';
      ctx.textAlign = 'right';
      ctx.fillText('DOWNWASH', W - 20, H - 18);
    }
  }

  // Pressure visualization
  if (state.vizMode === 'pressure') {
    for (let i = 0; i < transformed.length; i++) {
      const pt = transformed[i];
      const depth = pt.depth;
      const pressure = depth * Math.random();

      const hue = 360 - pressure * 120;
      ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.4)`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Labels
  ctx.fillStyle = 'rgba(93,170,255,0.6)';
  ctx.font = '11px JetBrains Mono';
  ctx.textAlign = 'left';
  ctx.fillText(`AOA: ${state.aoa}°`, 20, H - 30);
  ctx.fillText(`Span: ${state.span.toFixed(1)}x`, 20, H - 15);

  requestAnimationFrame(animate);
}

// ════════════════════════════════════════════════════════════════════════════════
// CONTROLS & INTERACTION
// ════════════════════════════════════════════════════════════════════════════════

document.getElementById('aoaSlider').addEventListener('input', (e) => {
  state.aoa = parseFloat(e.target.value);
  document.getElementById('aoaValue').textContent = state.aoa + '°';
});

document.getElementById('spanSlider').addEventListener('input', (e) => {
  state.span = parseFloat(e.target.value);
  document.getElementById('spanValue').textContent = state.span.toFixed(1) + 'x';
});

document.getElementById('wingShape').addEventListener('change', (e) => {
  state.wingShape = e.target.value;
});

document.getElementById('vizMode').addEventListener('change', (e) => {
  state.vizMode = e.target.value;
});

// Mouse controls
canvas.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mousemove', (e) => {
  if (state.isDragging) {
    const dx = e.clientX - state.lastMouse.x;
    const dy = e.clientY - state.lastMouse.y;

    state.rotation.y += dx * 0.01;
    state.rotation.x += dy * 0.01;

    state.lastMouse = { x: e.clientX, y: e.clientY };
  }
});

canvas.addEventListener('mouseup', () => {
  state.isDragging = false;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.zoom *= 1 - e.deltaY * 0.001;
  state.zoom = Math.max(0.3, Math.min(3, state.zoom));
});

// Initialize
animate();
</script>

</body>
</html>
